name: Windows Qt Build

on:
  push:
    branches:
      - 'feature/bep44-46-mutable-torrents'
    tags:
      - 'v*-btpk-*'
  workflow_dispatch:

jobs:
  windows-qt:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        shell: bash
        run: |
          git submodule init
          git submodule deinit third-party/dht 2>/dev/null || true
          git -c protocol.version=2 submodule update --depth 1 || true
          if [ ! -f third-party/dht/dht.h ]; then
            git clone --depth 1 --branch feature/bep44-46-mutable-torrents \
              https://github.com/NoMoreNicksLeft/dht.git third-party/dht
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtactiveqt'
          cache: true

      - name: Install curl via vcpkg (no toolchain)
        shell: pwsh
        run: vcpkg install --triplet x64-windows curl openssl

      - name: Configure
        shell: pwsh
        run: |
          $vcpkg_path = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed' 'x64-windows'
          $qt_cmake = Join-Path $env:QT_ROOT_DIR 'lib' 'cmake' 'Qt6'
          $args = @(
            '-S', '.',
            '-B', 'build',
            '-G', 'Visual Studio 17 2022',
            '-A', 'x64',
            "-DCMAKE_PREFIX_PATH=$vcpkg_path",
            "-DQt6_DIR=$qt_cmake",
            '-DCMAKE_BUILD_TYPE=Release',
            '-DENABLE_QT=ON',
            '-DENABLE_GTK=OFF',
            '-DENABLE_MAC=OFF',
            '-DENABLE_CLI=ON',
            '-DENABLE_DAEMON=ON',
            '-DENABLE_UTILS=ON',
            '-DENABLE_TESTS=OFF',
            '-DENABLE_NLS=OFF',
            '-DUSE_SYSTEM_DHT=OFF',
            '-DUSE_SYSTEM_UTP=OFF',
            '-DUSE_SYSTEM_B64=OFF',
            '-DUSE_SYSTEM_EVENT2=OFF',
            '-DUSE_SYSTEM_DEFLATE=OFF',
            '-DUSE_SYSTEM_MINIUPNPC=OFF',
            '-DUSE_SYSTEM_NATPMP=OFF',
            '-DUSE_SYSTEM_PSL=OFF',
            '-DWITH_CRYPTO=openssl'
          )
          echo "Qt6_DIR=$qt_cmake"
          echo "CMAKE_PREFIX_PATH=$vcpkg_path"
          & cmake @args

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Deploy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          Copy-Item build\qt\Release\transmission-qt.exe staging\
          Copy-Item build\utils\Release\transmission-create.exe staging\
          Copy-Item build\utils\Release\transmission-show.exe staging\
          Copy-Item build\cli\Release\transmission-remote.exe staging\
          Copy-Item build\daemon\Release\transmission-daemon.exe staging\
          & windeployqt staging\transmission-qt.exe
          $vcpkg_bin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed' 'x64-windows' 'bin'
          if (Test-Path $vcpkg_bin) {
            Copy-Item (Join-Path $vcpkg_bin '*.dll') staging\ -Force -ErrorAction SilentlyContinue
          }

      - name: Create archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v') { $version = $tag }
          else { $version = "dev-" + "${{ github.sha }}".Substring(0, 8) }
          Compress-Archive -Path staging\* -DestinationPath "Transmission-$version-windows-x64-qt.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transmission-windows-qt
          path: Transmission-*-windows-x64-qt.zip
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Transmission-*-windows-x64-qt.zip
