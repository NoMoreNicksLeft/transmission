name: Linux GTK Debian Package

on:
  push:
    branches:
      - 'feature/bep44-46-mutable-torrents'
    tags:
      - 'v*-btpk-*'
  workflow_dispatch:

jobs:
  linux-gtk-deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        run: |
          git submodule init
          git submodule deinit third-party/dht 2>/dev/null || true
          git -c protocol.version=2 submodule update --depth 1 || true
          if [ ! -f third-party/dht/dht.h ]; then
            rm -rf third-party/dht
            git clone --depth 1 --branch feature/bep44-46-mutable-torrents \
              https://github.com/NoMoreNicksLeft/dht.git third-party/dht
          fi
          if [ ! -f third-party/libpsl/list/public_suffix_list.dat ]; then
            cd third-party/libpsl && git submodule update --init --depth 1 || true
            cd ../..
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gettext pkg-config \
            libgtkmm-4.0-dev \
            libglibmm-2.68-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libdeflate-dev \
            libevent-dev \
            libminiupnpc-dev \
            libnatpmp-dev \
            libpsl-dev \
            dpkg-dev \
            fakeroot

      - name: Debug GTK deps
        run: |
          echo '=== giomm pkg-config ==='
          pkg-config --list-all | grep -i giomm || echo 'no giomm found'
          echo '=== gtkmm pkg-config ==='
          pkg-config --list-all | grep -i gtkmm || echo 'no gtkmm found'
          echo '=== glibmm pkg-config ==='
          pkg-config --list-all | grep -i glibmm || echo 'no glibmm found'
          echo '=== apt-cache search giomm ==='
          apt-cache search giomm | head -10

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_GTK=ON \
            -DUSE_GTK_VERSION=4 \
            -DENABLE_QT=OFF \
            -DENABLE_MAC=OFF \
            -DENABLE_CLI=ON \
            -DENABLE_DAEMON=ON \
            -DENABLE_UTILS=ON \
            -DENABLE_TESTS=OFF \
            -DUSE_SYSTEM_DHT=OFF \
            -DUSE_SYSTEM_UTP=OFF \
            -DUSE_SYSTEM_B64=OFF \
            -DWITH_CRYPTO=openssl

      - name: Build
        run: cmake --build build

      - name: Install to staging
        run: DESTDIR="${{ github.workspace }}/pkg" cmake --install build --strip

      - name: Create .deb
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="4.1.1~btpk.alpha+git$(echo "${{ github.sha }}" | cut -c1-8)"
          fi
          PKG_DIR="${{ github.workspace }}/pkg"
          mkdir -p "$PKG_DIR/DEBIAN"
          DEPS=$(dpkg-shlibdeps -O "$PKG_DIR/usr/bin/transmission-gtk" "$PKG_DIR/usr/bin/transmission-daemon" "$PKG_DIR/usr/bin/transmission-remote" "$PKG_DIR/usr/bin/transmission-create" 2>/dev/null | sed 's/shlibs:Depends=//') || DEPS=""
          if [ -z "$DEPS" ]; then
            DEPS="libgtkmm-4.0-0t64, libcurl4t64, libssl3t64, libevent-2.1-7t64"
          fi
          printf 'Package: transmission-btpk\n' > "$PKG_DIR/DEBIAN/control"
          printf 'Version: %s\n' "$VERSION" >> "$PKG_DIR/DEBIAN/control"
          printf 'Section: net\n' >> "$PKG_DIR/DEBIAN/control"
          printf 'Priority: optional\n' >> "$PKG_DIR/DEBIAN/control"
          printf 'Architecture: amd64\n' >> "$PKG_DIR/DEBIAN/control"
          printf 'Depends: %s\n' "$DEPS" >> "$PKG_DIR/DEBIAN/control"
          printf 'Conflicts: transmission-gtk\n' >> "$PKG_DIR/DEBIAN/control"
          printf 'Maintainer: John Oyler <john.m.oyler@gmail.com>\n' >> "$PKG_DIR/DEBIAN/control"
          printf 'Description: Transmission BitTorrent client with BEP 44/46 mutable torrent support\n' >> "$PKG_DIR/DEBIAN/control"
          printf ' A fork of Transmission 4.1.1 adding experimental mutable torrent\n' >> "$PKG_DIR/DEBIAN/control"
          printf ' (BEP 44/46) support. Includes GTK4 GUI, daemon, and CLI tools.\n' >> "$PKG_DIR/DEBIAN/control"
          dpkg-deb --build "$PKG_DIR" "transmission-btpk_${VERSION}_amd64.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transmission-linux-gtk-deb
          path: transmission-btpk_*.deb
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: transmission-btpk_*.deb
